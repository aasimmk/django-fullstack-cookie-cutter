# Read the Docs — https://docs.readthedocs.io/en/stable/config-file/v2.html
# Import this repo in RTD; builds the MkDocs site defined in mkdocs.yml.
version: 2

build:
  os: ubuntu-22.04
  tools:
{% if cookiecutter.python_version in ["3.15"] %}
    # Read the Docs does not offer Python {{ cookiecutter.python_version }} yet; the docs build only needs MkDocs.
    python: "3.14"
{% else %}
    python: "{{ cookiecutter.python_version }}"
{% endif %}

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - requirements: docs/requirements.txt
