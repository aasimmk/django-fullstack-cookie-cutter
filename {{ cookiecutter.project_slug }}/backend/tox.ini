# Tox environments run from backend/ with uv (tox-uv). Usage: uv sync && uv run tox run -e py
# https://github.com/tox-dev/tox-uv
[tox]
minversion = 4.0
requires =
    tox-uv>=1.23.0
env_list =
    py
    ruff
    migrate
skip_missing_interpreters = true

[testenv]
runner = uv-venv-runner
dependency_groups = dev
basepython = python{{ cookiecutter.python_version }}

[testenv:py]
description = pytest (Django test settings)
commands =
    uv run pytest {posargs:}

[testenv:ruff]
description = Ruff lint and format check
commands =
    uv run ruff check .
    uv run ruff format --check .

[testenv:migrate]
description = Django makemigrations --check --dry-run
commands =
    uv run python manage.py makemigrations --check --dry-run
