name: {{ cookiecutter.project_slug }}
region: nyc

services:
  - name: web
    github:
      repo: your-org/{{ cookiecutter.project_slug }}
      branch: main
      deploy_on_push: true
    dockerfile_path: docker/backend/Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: DJANGO_SETTINGS_MODULE
        value: src.settings.production
      - key: DJANGO_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
{% if cookiecutter.use_redis_cache == "y" %}
      - key: REDIS_CACHE_URL
        scope: RUN_TIME
        type: SECRET
{% endif %}
{% if cookiecutter.use_celery == "y" %}
      - key: CELERY_BROKER_URL
        scope: RUN_TIME
        type: SECRET
      - key: CELERY_RESULT_BACKEND
        scope: RUN_TIME
        type: SECRET
{% endif %}

{% if cookiecutter.use_celery == "y" %}
workers:
  - name: celery-worker
    github:
      repo: your-org/{{ cookiecutter.project_slug }}
      branch: main
      deploy_on_push: true
    dockerfile_path: docker/backend/Dockerfile
    instance_count: 1
    instance_size_slug: basic-xxs
    run_command: uv run celery -A src worker -l info
    envs:
      - key: DJANGO_SETTINGS_MODULE
        value: src.settings.production
      - key: DJANGO_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
{% if cookiecutter.use_redis_cache == "y" %}
      - key: REDIS_CACHE_URL
        scope: RUN_TIME
        type: SECRET
{% endif %}
      - key: CELERY_BROKER_URL
        scope: RUN_TIME
        type: SECRET
      - key: CELERY_RESULT_BACKEND
        scope: RUN_TIME
        type: SECRET

  - name: celery-beat
    github:
      repo: your-org/{{ cookiecutter.project_slug }}
      branch: main
      deploy_on_push: true
    dockerfile_path: docker/backend/Dockerfile
    instance_count: 1
    instance_size_slug: basic-xxs
    run_command: uv run celery -A src beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    envs:
      - key: DJANGO_SETTINGS_MODULE
        value: src.settings.production
      - key: DJANGO_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
{% if cookiecutter.use_redis_cache == "y" %}
      - key: REDIS_CACHE_URL
        scope: RUN_TIME
        type: SECRET
{% endif %}
      - key: CELERY_BROKER_URL
        scope: RUN_TIME
        type: SECRET
      - key: CELERY_RESULT_BACKEND
        scope: RUN_TIME
        type: SECRET
{% endif %}
